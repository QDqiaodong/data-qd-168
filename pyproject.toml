[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-168"
version = "0.1.0"
description = "多语言资源构建"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
locale-bundle = "locale_bundle.cli:main"
locale-bundle-history = "locale_bundle.history_cli:main"
locale-bundle-release = "locale_bundle.release_cli:main"
locale-bundle-work-queue = "locale_bundle.workqueue_cli:main"
locale-bundle-vendor = "locale_bundle.vendor_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
